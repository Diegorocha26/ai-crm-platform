[project]
name = "ai-crm-platform"
version = "0.1.0"
description = "AI CRM Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "redis[hiredis]>=5.0.0",
    "rq>=1.16.0",
    "qdrant-client>=1.9.0",
    "openai>=1.30.0",
    "ollama>=0.2.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "streamlit>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "models", "schemas", "services", "workers", "monitoring"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.1",
]
